name: Runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: python3 scripts/generate-api-set-schema.py --check
      - run: npm test
      - run: npm run test:softfloat
      - run: python3 scripts/generate-x87-remainder-vectors.py --check-native
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:wine-base-upload
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:controls
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:webgpu
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:render-targets
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d9-cubemap-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d9-volume-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:rgba16-backend
        env:
          BROWSER_CHANNEL: chromium
          # SwiftShader lacks tier1. Verify rejection/allocation safety there;
          # precision acceptance remains mandatory in hardware browser runs.
          WINEBROWSER_ALLOW_UNSUPPORTED_RGBA16: '1'
      - run: npm run test:shared-depth-extent-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d12-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d10-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:shaders
        env:
          BROWSER_CHANNEL: chromium
      - run: node scripts/fetch-targets.mjs winapiexec-1.2-x86 pts-tinype-hh4t-x86 7zip-7zr-26.03-x86
      - run: node scripts/test-external-browser.mjs
        env:
          BROWSER_CHANNEL: chromium
      - name: Build for GitHub Pages
        run: npm run build
        env:
          WINEBROWSER_BASE_PATH: /winebrowser/
      - name: Test static hosting without isolation headers
        run: |
          node scripts/serve-pages.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run test:pages
          npm run test:installer-apis
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:processes
          npm run test:api-sets
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:foss-tools
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:7zip-full
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:file-locks
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:delay-imports
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:dll-search
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:native-services
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:sqlite
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:lua
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:cpp-runtime
          npm run test:x87-remainder
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:wine-base-upload
          npm run test:windows
          npm run test:tetris
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:minesweeper
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:menus
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:treeview
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:lists
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:custom-child
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:gui-controls
          WINEBROWSER_TEST_URL=http://127.0.0.1:4193/winebrowser/ npm run test:directdraw
          npm run test:d3d8
          npm run test:d3d9
          npm run test:d3d9-shader-cube
          npm run test:opengl
          npm run fetch:opengl
          npm run test:opengl-upstream
          npm run test:raytraced-shadows
          npm run test:d3d12
          npm run test:d3d12-cube
          npm run test:learning-dx12
          npm run test:dx12-city
          npm run test:d3d12-parade
          npm run test:d3d12-constbuffer
          npm run test:d3d12-rootcbv
          npm run test:d3d12-constants
          npm run test:d3d12-texture
          npm run test:d3d12-rendertexture
          npm run test:d3d12-terrain
          npm run test:d3d12-knot
          npm run test:d3d10
          npm run test:vulkan
          npm run test:vulkan-compute
          npm run test:skinning
          npm run test:seh
          npm run test:d3d12-blend
          npm run test:exec-memory
          npm run test:humus-d3d9
          npm run test:rollercoaster
          npm run test:instancing
          npm run test:transparent-shadows
          npm run test:water
          npm run test:7zr
        env:
          BROWSER_CHANNEL: chromium
          WINEBROWSER_ALLOW_UNSUPPORTED_RGBA16: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
