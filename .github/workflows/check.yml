name: Runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/run-static-suite.mjs --check
      - run: python3 scripts/generate-api-set-schema.py --check
      - run: python3 scripts/generate-toolbar-assets.py --check
      - run: npm test
      - run: npm run test:packed-sse-oracle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packed-sse-native-oracle
          path: .cache/packed-sse-oracle/packed-sse-results.bin
          include-hidden-files: true
      - run: npm run test:softfloat
      - run: python3 scripts/generate-x87-remainder-vectors.py --check-native
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:wine-base-upload
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:controls
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:webgpu
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:render-targets
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d9-cubemap-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d9-volume-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:rgba16-backend
        env:
          BROWSER_CHANNEL: chromium
          # SwiftShader lacks tier1. Verify rejection/allocation safety there;
          # precision acceptance remains mandatory in hardware browser runs.
          WINEBROWSER_ALLOW_UNSUPPORTED_RGBA16: '1'
      - run: npm run test:shared-depth-extent-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d12-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d10-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:shaders
        env:
          BROWSER_CHANNEL: chromium
      - run: node scripts/fetch-targets.mjs winapiexec-1.2-x86 pts-tinype-hh4t-x86 7zip-7zr-26.03-x86
      - run: node scripts/test-external-browser.mjs
        env:
          BROWSER_CHANNEL: chromium
      - name: Build for GitHub Pages
        run: npm run build
        env:
          WINEBROWSER_BASE_PATH: /winebrowser/
      - uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: dist/
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  static:
    timeout-minutes: 40
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, controls, gdi-shapes, gdi-pixels, dialogs, legacy-graphics, directx12, vulkan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: static-dist
          path: dist/
      - name: Check Pages-style static hosting
        run: node scripts/run-static-suite.mjs ${{ matrix.group }}
        env:
          BROWSER_CHANNEL: chromium
          WINEBROWSER_ALLOW_UNSUPPORTED_RGBA16: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: |
            evidence/
            .scratch/ci-logs/
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, static]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
