name: Runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:softfloat
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:controls
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:webgpu
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:d3d12-backend
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:shaders
        env:
          BROWSER_CHANNEL: chromium
      - run: node scripts/fetch-targets.mjs winapiexec-1.2-x86 pts-tinype-hh4t-x86
      - run: node scripts/test-external-browser.mjs
        env:
          BROWSER_CHANNEL: chromium
      - name: Build for GitHub Pages
        run: npm run build
        env:
          WINEBROWSER_BASE_PATH: /winebrowser/
      - name: Test static hosting without isolation headers
        run: |
          node scripts/serve-pages.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run test:pages
          npm run test:windows
          npm run test:tetris
          npm run test:d3d9
          npm run test:d3d9-shader-cube
          npm run test:d3d12
          npm run test:d3d12-cube
        env:
          BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
